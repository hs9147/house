# 사내 Git 서버(Gitea) — 1차(중소규모) 배포. MIT 라이선스, 상용·사내 사용 무제한.
# 배경: docs/cloud-platform-paas-design-review.md 10.2절 (GitHub 대체 권고)
#
# 실행: docker compose -f platform/infra/gitea/docker-compose.yml up -d
# 최초 접속 후 관리자 계정 생성 → Site Administration → Actions/webhook 등은 그대로 사용 가능
#
# 플랫폼과의 연결:
#   - 프로젝트 등록 시 git_url을 이 Gitea 인스턴스 주소로 지정
#   - 웹훅: Gitea 리포 Settings → Webhooks → Payload URL = https://<paas>/paas/webhooks/git,
#     Secret = PAAS_WEBHOOK_SECRET과 동일 값 (플랫폼이 X-Gitea-Signature를 자동 인식)

services:
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-git.example.com}
      - GITEA__server__ROOT_URL=https://${GITEA_DOMAIN:-git.example.com}/
      - GITEA__server__SSH_PORT=2222
      # SSH 포트를 못 여는 환경(80만 허용 등)이라면 SSH를 아예 끈다. 안 끄면 Gitea UI가
      # 계속 SSH clone 주소를 함께 보여줘서, 사용자가 그걸 복사해 쓰다 실패한다.
      # (플랫폼 자신은 SSH를 쓰지 않는다 — clone/fetch/push 모두 http + 토큰 헤더다.)
      #   GITEA__server__DISABLE_SSH=true
      # 사내 전용 — 초대 없이 가입 금지 (관리자가 계정 생성)
      - GITEA__service__DISABLE_REGISTRATION=true
      # 소규모는 내장 SQLite로 충분. 규모가 커지면 Postgres로 교체:
      #   GITEA__database__DB_TYPE=postgres
      #   GITEA__database__HOST=postgres:5432
      #   GITEA__database__NAME=gitea
      #   GITEA__database__USER=... / PASSWD=...
      - GITEA__database__DB_TYPE=sqlite3
      # 도메인을 따로 못 받아 플랫폼과 같은 도메인의 서브패스(예: /gitea/)로 내보낼 때는
      # ROOT_URL에 그 서브패스까지 포함해야 한다(README.md "서브패스로 노출하는 경우" 참고):
      #   GITEA__server__ROOT_URL=https://paas.example.com/gitea/
      # Keycloak SSO 연동 시(README.md "최초 설정" 3번 — gitea admin auth add-oauth로
      # 소스를 등록한 뒤) 관리자가 계정을 미리 안 만들어도 되게 하려면:
      #   GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      #   GITEA__oauth2_client__USERNAME=email
      #   GITEA__oauth2_client__ACCOUNT_LINKING=auto
      # [oauth2] ENABLED와 DEFAULT_APPLICATIONS는 기본값(켜짐)을 그대로 둔다 — 개발자가
      # git push할 때 토큰을 손으로 만들지 않고 브라우저 로그인으로 끝내는 경로가
      # 여기에 달려 있다(Gitea가 Git Credential Manager용 OAuth 앱을 미리 등록해 둔다).
      # 끄면 GCM이 OAuth를 못 찾아 비밀번호를 묻는 방식으로 되돌아간다. README 참고.
    volumes:
      - gitea-data:/data
    ports:
      # 컨테이너 자체에는 공인 포트를 열지 않고 Caddy가 리버스 프록시
      # (Caddyfile.example 참고).
      - "127.0.0.1:3000:3000"
      # SSH clone/push용. 쓰지 않는다면(위 DISABLE_SSH=true) 이 줄을 지운다 —
      # 플랫폼 동작에는 영향이 없다(git은 http + 토큰 헤더로만 오간다).
      - "127.0.0.1:2222:22"

volumes:
  gitea-data:
